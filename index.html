<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PaisaMani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050d14; --bg2:#0a1a24; --card:#0f2029; --card2:#132a35;
  --line:#2f6b6b; --mint:#6ee7c8; --mint2:#8ee6b0; --text:#f2fbfa; --muted:#9fb4bb;
  --red:#ff8a8a; --green:#6ee7c8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#050d14}
html,body{min-height:100%}
body{
  font-family:'Inter','Noto Sans Tamil',system-ui,sans-serif;color:var(--text);
  background:radial-gradient(ellipse at 50% 20%,#123238 0%,#0a1a24 40%,#050d14 80%) fixed;
  overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select{font-family:inherit}
.screen{display:none;min-height:100vh;padding:24px 18px 40px;max-width:520px;margin:0 auto}
.screen.active{display:block}
.eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--mint);font-weight:700;text-align:center}
.center{text-align:center}
.mint{color:var(--mint)}
.muted{color:var(--muted)}

/* Avatar */
.avatar-wrap{perspective:900px;display:flex;justify-content:center}
.avatar-ring{
  width:min(60vw,260px);aspect-ratio:1;border-radius:50%;border:2px solid var(--line);
  background:radial-gradient(circle,#1d4147 0%,#0b1c25 70%);
  box-shadow:0 0 80px rgba(110,231,200,.18), inset 0 0 40px rgba(0,0,0,.4);
  display:flex;align-items:flex-end;justify-content:center;overflow:hidden;
  transform-style:preserve-3d;transition:transform .15s ease-out;
}
.avatar-ring img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:scale(1.05) translateY(0)}50%{transform:scale(1.05) translateY(-4px)}}

/* Language */
#langScreen{display:none}
#langScreen.active{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.hello{font-size:clamp(30px,9vw,44px);font-weight:800;text-align:center;line-height:1.15}
.hello b{color:var(--mint)}
.lang-row{display:flex;gap:14px;width:100%;margin-top:6px}
.lang-btn{
  flex:1;padding:26px 10px;border-radius:26px;border:1.5px solid var(--line);
  background:linear-gradient(160deg,#132a33,#0e1f28);font-size:22px;font-weight:700;color:#fff;transition:.2s;
}
.lang-btn:hover,.lang-btn:active{transform:translateY(-2px);box-shadow:0 0 24px rgba(110,231,200,.2);border-color:var(--mint)}
.sub{color:var(--muted);font-size:20px;text-align:center}
.small{font-size:14px;color:var(--muted);text-align:center}

/* Auth */
.card{
  background:linear-gradient(160deg,var(--card2),var(--card));border:1.5px solid var(--line);
  border-radius:30px;padding:24px;
}
.brand{font-weight:800;letter-spacing:.14em;font-size:18px}
.brand span{color:var(--mint)}
.tabs{display:flex;gap:8px;margin:18px 0}
.tab{flex:1;padding:12px;border-radius:16px;border:1.5px solid var(--line);background:transparent;font-weight:600;font-size:15px;color:var(--muted)}
.tab.on{background:rgba(110,231,200,.12);color:var(--mint);border-color:var(--mint)}
label.f{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;letter-spacing:.04em}
input.in,select.in{
  width:100%;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);
  background:#0a1820;color:var(--text);font-size:16px;outline:none;
}
input.in:focus,select.in:focus{border-color:var(--mint);box-shadow:0 0 0 3px rgba(110,231,200,.12)}
.btn{
  padding:14px 20px;border-radius:18px;border:1.5px solid var(--line);background:#112530;
  font-weight:600;font-size:16px;transition:.2s;
}
.btn:hover{border-color:var(--mint)}
.btn.primary{background:linear-gradient(90deg,#66d3c3,#8ee6b0);color:#06241f;border:none;font-weight:700}
.btn.full{width:100%;margin-top:20px}
.btn.danger{color:var(--red);border-color:#7a3b3b}
.langbox{
  margin:6px 0 4px;padding:12px;border-radius:20px;border:1.5px dashed var(--line);background:rgba(110,231,200,.04);
}
.langbox .t{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mint);font-weight:700;margin-bottom:8px;text-align:center}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:transparent;font-size:16px;font-weight:600;color:var(--muted)}
.seg button.on{background:linear-gradient(90deg,#66d3c3,#8ee6b0);color:#06241f;border-color:transparent}
.err{color:var(--red);font-size:14px;margin-top:12px;text-align:center;min-height:18px}

/* Top bar */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:12px 14px;border:1.5px solid #1f4348;border-radius:30px;background:rgba(8,22,30,.8);
  backdrop-filter:blur(8px);position:sticky;top:10px;z-index:10;
}
.logo{font-weight:800;letter-spacing:.1em;font-size:15px;white-space:nowrap}
.logo span{color:var(--mint)}
.pill{padding:9px 14px;border-radius:16px;border:1.5px solid var(--line);background:transparent;font-size:14px;font-weight:500;color:var(--mint)}
.toggle{background:none;border:none;color:var(--muted);font-size:14px;padding:6px;white-space:nowrap}
.topbar{flex-wrap:wrap}
.tbtns{display:flex;gap:6px}
.tbtns .pill{padding:8px 11px;font-size:13px;white-space:nowrap}
.pill.out{color:var(--red);border-color:#7a3b3b}
@media(max-width:430px){.logo{font-size:12px;letter-spacing:.05em}.toggle{font-size:12px}.tbtns .pill{padding:7px 9px;font-size:12px}}

/* Dashboard */
.dash{margin-top:18px;display:grid;gap:14px}
.dcard{border:1.5px solid #234a50;border-radius:26px;padding:18px;background:linear-gradient(160deg,rgba(19,42,53,.9),rgba(11,27,36,.9))}
.dcard h3{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--mint);font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.dcard h3 a{color:var(--muted);letter-spacing:.04em;text-transform:none;font-weight:500;font-size:13px;cursor:pointer}
.bal{background:radial-gradient(circle at 15% 0%,#1d5a57 0%,#12323a 55%,#0b1c25 100%);border-color:var(--mint)}
.bal .big{font-size:clamp(34px,11vw,46px);font-weight:800;letter-spacing:-.02em;margin:2px 0 12px}
.bal .big.neg{color:var(--red)}
.split{display:flex;gap:10px;margin-top:6px}
.split div{flex:1;border-radius:16px;padding:10px 12px;background:rgba(5,13,20,.45);border:1px solid #234a50}
.split small{display:block;color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.split b{font-size:16px}
.qa{display:flex;gap:10px;margin-top:14px}
.qa .btn{flex:1;padding:13px 8px;font-size:15px}
.trend{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:4px}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.trend .bars{display:flex;align-items:flex-end;gap:3px;height:92px;width:100%;justify-content:center}
.trend .bars i{display:block;width:42%;max-width:16px;border-radius:6px 6px 2px 2px;min-height:3px}
.trend .bars i.i{background:linear-gradient(180deg,#8ee6b0,#66d3c3)}
.trend .bars i.e{background:linear-gradient(180deg,#ffb1b1,#ff7a7a)}
.trend small{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;background:var(--mint)}
.legend span.e::before{background:#ff7a7a}
.goalbox{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:88px;height:88px;flex:0 0 88px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px}
.dcard .list .it{padding:10px 0}

.hero h1{font-size:clamp(28px,8vw,38px);font-weight:800;text-align:center;letter-spacing:-.02em;margin:14px 0 8px;line-height:1.2}
.hero h1 b{color:var(--mint)}
.hero p{color:var(--muted);text-align:center;font-size:16px;line-height:1.6;padding:0 6px}

/* Orbit */
.orbit{position:relative;width:min(94vw,440px);height:min(118vw,540px);margin:20px auto 0}
.orbit::before,.orbit::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.orbit::before{inset:14% 6%;border:1.5px solid rgba(47,107,107,.5)}
.orbit::after{inset:4% 0;border:1.5px dashed rgba(47,107,107,.35)}
.orbit .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:48%;z-index:1}
.orbit .core .avatar-ring{width:100%}
.node{
  position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;
  background:none;border:none;z-index:3;
}
.node .ic{
  width:68px;height:68px;border-radius:50%;border:1.8px solid var(--line);
  background:radial-gradient(circle,#173540,#0b1d27);display:flex;align-items:center;justify-content:center;
  font-size:26px;box-shadow:0 0 28px rgba(110,231,200,.12);transition:.2s;
}
.node:hover .ic,.node:active .ic{transform:scale(1.08);border-color:var(--mint);box-shadow:0 0 30px rgba(110,231,200,.35)}
.node .lb{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.balpill{
  position:absolute;left:50%;bottom:1%;transform:translateX(-50%);z-index:4;
  padding:12px 22px;border-radius:24px;background:rgba(10,24,32,.92);border:1.5px solid var(--line);
  letter-spacing:.08em;font-weight:600;font-size:15px;white-space:nowrap;
}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(2,6,10,.82);display:none;z-index:50;overflow-y:auto;padding:22px 14px}
.overlay.show{display:block}
.modal{
  max-width:520px;margin:0 auto;border-radius:34px;border:1.5px solid var(--line);position:relative;
  background:linear-gradient(160deg,#16303a,#0c1b24);padding:26px 22px 24px;
}
.modal .close{
  position:absolute;right:16px;top:16px;width:46px;height:46px;border-radius:50%;
  border:1.5px solid var(--line);background:#0b1b24;font-size:20px;
}
.modal h2{font-size:30px;font-weight:800;margin:8px 60px 14px 0;letter-spacing:-.01em}
.modal .eb{font-size:12px;letter-spacing:.3em;font-weight:700;color:var(--mint);text-transform:uppercase}
.modal p.lead{color:var(--muted);font-size:16px;line-height:1.6;margin-bottom:16px}
.box{border:1.5px solid #234a50;border-radius:22px;padding:16px;margin-bottom:12px;background:rgba(10,24,32,.55)}
.box h4{font-size:16px;margin-bottom:6px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.stat{border:1.5px solid #234a50;border-radius:18px;padding:12px 8px;text-align:center;background:rgba(10,24,32,.55)}
.stat small{display:block;font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.stat b{font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-size:14px;color:var(--text)}
.chip.on{background:rgba(110,231,200,.14);border-color:var(--mint);color:var(--mint)}
.list .it{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #1b3a40}
.list .it:last-child{border-bottom:none}
.list .meta{flex:1;min-width:0}
.list .meta b{display:block;font-size:15px}
.list .meta small{color:var(--muted);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:700;font-size:15px}
.amt.in{color:var(--green)} .amt.out{color:var(--red)}
.x{background:none;border:none;color:var(--muted);font-size:18px;padding:4px 8px}
.bar{height:10px;border-radius:99px;background:#0a1820;overflow:hidden;border:1px solid #1d4146}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#66d3c3,#8ee6b0);border-radius:99px}
.barrow{margin:12px 0}
.barrow .h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.monthnav button{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:#0b1b24;font-size:18px}
.monthnav b{font-size:17px}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);opacity:0;z-index:99;
  background:#0f2d2c;border:1.5px solid var(--mint);color:var(--text);padding:12px 20px;border-radius:18px;font-size:14px;transition:.3s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{color:var(--muted);text-align:center;padding:18px 0;font-size:14px}
.foot{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.25em;text-transform:uppercase;margin-top:44px}
</style>
</head>
<body>

<!-- 1. LANGUAGE -->
<section id="langScreen" class="screen">
  <div class="avatar-wrap"><div class="avatar-ring tilt" id="avLang"></div></div>
  <div class="eyebrow">A Personal Finance Universe</div>
  <div class="hello">வணக்கம்! <b>Vanakkam!</b></div>
  <div class="sub">Which language would you prefer?</div>
  <div class="lang-row">
    <button class="lang-btn" onclick="chooseLang('ta')">தமிழ்</button>
    <button class="lang-btn" onclick="chooseLang('en')">English</button>
  </div>
  <div class="small">Choose your language to enter PaisaMani.<br>மொழியைத் தேர்ந்தெடுக்கவும்.</div>
</section>

<!-- 2. LOGIN -->
<section id="authScreen" class="screen">
  <div class="avatar-wrap" style="margin:6px 0 14px"><div class="avatar-ring tilt" id="avAuth" style="width:130px"></div></div>
  <div class="center brand" style="margin:0 0 14px">◈ PAISA<span>MANI</span></div>
  <div class="card">
    <div class="langbox">
      <div class="t" data-en="Confirm your language" data-ta="உங்கள் மொழியை உறுதிசெய்யவும்"></div>
      <div class="seg">
        <button id="segTa" onclick="setLang('ta')">தமிழ்</button>
        <button id="segEn" onclick="setLang('en')">English</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab on" id="tabLogin" onclick="authMode('login')" data-en="Login" data-ta="உள்நுழை"></button>
      <button class="tab" id="tabReg" onclick="authMode('register')" data-en="Register" data-ta="பதிவு செய்"></button>
    </div>
    <label class="f" data-en="Email address" data-ta="மின்னஞ்சல் முகவரி"></label>
    <input class="in" id="uName" type="email" autocomplete="email" autocapitalize="none" inputmode="email">
    <label class="f" data-en="Password" data-ta="கடவுச்சொல்"></label>
    <input class="in" id="uPass" type="password" autocomplete="current-password">
    <div id="confWrap" style="display:none">
      <label class="f" data-en="Confirm password" data-ta="கடவுச்சொல்லை உறுதிசெய்"></label>
      <input class="in" id="uPass2" type="password" autocomplete="new-password">
    </div>
    <div class="err" id="authErr"></div>
    <button class="btn primary full" id="authBtn" onclick="submitAuth()"></button>
    <p class="small" style="margin-top:16px" data-en="Your finance data syncs securely to your account when cloud setup is complete." data-ta="கிளவுட் அமைப்பு முடிந்ததும் உங்கள் நிதித் தரவு கணக்குடன் பாதுகாப்பாக ஒத்திசைக்கப்படும்."></p>
  </div>
</section>

<!-- 3. APP -->
<section id="appScreen" class="screen">
  <div class="topbar">
    <div class="logo">◈ PAISA<span>MANI</span></div>
    <div class="tbtns">
      <button class="pill" onclick="goHome()">⌂ <span data-en="Home" data-ta="முகப்பு"></span></button>
      <button class="pill out" onclick="logout()">⏻ <span data-en="Logout" data-ta="வெளியேறு"></span></button>
    </div>
    <button class="toggle" id="langToggle" onclick="toggleLang()"></button>
  </div>
  <div class="hero">
    <div class="eyebrow" style="margin-top:26px" id="heroEb"></div>
    <h1 id="heroH"></h1>
    <p id="heroP"></p>
  </div>
  <div class="dash" id="dashTop"></div>
  <div class="orbit" id="orbit">
    <div class="core"><div class="avatar-ring tilt" id="avCore"></div></div>
  </div>
  <div class="foot" data-en="Tap a node to explore" data-ta="ஒரு பகுதியைத் தேர்ந்தெடுக்கவும்"></div>
  <div class="dash" id="dashBottom" style="margin-top:22px"></div>
</section>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

function saveData(){
  if(!user || !data) return;
  store.set('pm_data_'+user, data); // local cache / offline fallback

      .then(({error})=>{ if(error) console.error('PaisaMani cloud save failed:', error.message); });

}

/* ============ AUTH ============ */
let authState='login';
function authMode(m,silent){
  authState=m;
  $('tabLogin').classList.toggle('on',m==='login'); $('tabReg').classList.toggle('on',m==='register');
  $('confWrap').style.display = m==='register'?'block':'none';
  $('authBtn').textContent = m==='login'?L('Login','உள்நுழை'):L('Create account','கணக்கை உருவாக்கு');
  $('uPass').autocomplete = m==='login'?'current-password':'new-password';
  $('uName').autocomplete = 'email';
  if(!silent) $('authErr').textContent='';
}
async function submitAuth(){
  const email=$('uName').value.trim().toLowerCase(), pass=$('uPass').value, err=$('authErr');
  err.textContent='';
  if(!cloudConfigured() || !supabaseClient){ err.textContent=L('Cloud login is not configured yet. Add your Supabase project URL and publishable/anon key to the website first.','கிளவுட் உள்நுழைவு இன்னும் அமைக்கப்படவில்லை. முதலில் Supabase விவரங்களை இணையதளத்தில் சேர்க்கவும்.'); return; }
  if(!email || !pass){ err.textContent=L('Enter your email and password.','மின்னஞ்சல் மற்றும் கடவுச்சொல்லை உள்ளிடவும்.'); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ err.textContent=L('Enter a valid email address.','சரியான மின்னஞ்சல் முகவரியை உள்ளிடவும்.'); return; }
  if(authState==='register'){
    if(pass.length<6){ err.textContent=L('Password must be at least 6 characters.','கடவுச்சொல் குறைந்தது 6 எழுத்துகள் இருக்க வேண்டும்.'); return; }
    if(pass!==$('uPass2').value){ err.textContent=L('Passwords do not match.','கடவுச்சொற்கள் பொருந்தவில்லை.'); return; }
    const {data:result,error}=await supabaseClient.auth.signUp({email,password:pass});
    if(error){ err.textContent=authError(error); return; }
    if(!result.session){ err.textContent=L('Account created. Check your email to verify it, then return here to log in.','கணக்கு உருவாக்கப்பட்டது. மின்னஞ்சலைச் சரிபார்த்து பின்னர் உள்நுழையவும்.'); authMode('login',true); $('uName').value=email; $('uPass').value=''; $('uPass2').value=''; return; }
    await enter(result.user.email,result.user.id);
  } else {
    const {data:result,error}=await supabaseClient.auth.signInWithPassword({email,password:pass});

function authError(error){
  const msg=(error?.message||'').toLowerCase();
  if(msg.includes('invalid login credentials')) return L('Email or password is incorrect.','மின்னஞ்சல் அல்லது கடவுச்சொல் தவறு.');
  if(msg.includes('already registered')||msg.includes('already been registered')) return L('This email already has an account. Try logging in.','இந்த மின்னஞ்சலில் ஏற்கனவே கணக்கு உள்ளது. உள்நுழையவும்.');
  if(msg.includes('email not confirmed')) return L('Please verify your email before logging in.','உள்நுழைவதற்கு முன் மின்னஞ்சலைச் சரிபார்க்கவும்.');
  return error?.message || L('Something went wrong. Please try again.','பிழை ஏற்பட்டது. மீண்டும் முயற்சிக்கவும்.');
}

function goalInfo(){
  const g=data.goal; if(!g) return null;
  const net=totals(data.tx.filter(t=>t.date>=g.start)).b, saved=Math.max(0,(g.already||0)+net);
  const pct=Math.min(100,saved/g.target*100), now=new Date(), end=new Date(g.date);
  let months=(end.getFullYear()-now.getFullYear())*12+(end.getMonth()-now.getMonth())+(end.getDate()>=now.getDate()?0:-1);
  months=Math.max(months,0);
  const left=Math.max(0,g.target-saved);
  return {g,saved,pct,months,left,per:months>0?left/months:left};
}

function shiftMonth(n,fn){ viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+n,1); currentModal=fn; fn(); }
function monthTx(){ const k=mKey(viewMonth); return data.tx.filter(t=>t.date.startsWith(k)); }
function statsHtml(tt){ return `<div class="stats"><div class="stat"><small>${L('Income','வருமானம்')}</small><b class="mint">${inr(tt.i)}</b></div><div class="stat"><small>${L('Expense','செலவு')}</small><b style="color:var(--red)">${inr(tt.e)}</b></div><div class="stat"><small>${L('Balance','இருப்பு')}</small><b>${inr(tt.b)}</b></div></div>`; }

/* ---- Expenses ledger ---- */
function mExpenses(){
  const list=monthTx().sort((a,b)=>b.date.localeCompare(a.date)), tt=totals(list);
  openModal(L('LEDGER / 03','பதிவேடு / 03'), L('Expenses','செலவுகள்'), monthNav('mExpenses')+statsHtml(tt)+
    `<div class="list">${list.length?list.map(txRow).join(''):`<div class="empty">${L('No entries this month','இந்த மாதம் பதிவுகள் இல்லை')}</div>`}</div>`);
}

/* ---- Reports ---- */
function mReports(){
  const list=monthTx(), tt=totals(list), ex=list.filter(t=>t.type==='expense'), by={};
  ex.forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount);
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  openModal(L('INSIGHTS / 04','பார்வை / 04'), L('Reports','அறிக்கைகள்'), monthNav('mReports')+statsHtml(tt)+
    `<div class="box"><h4>${L('Spending by category','வகை வாரியான செலவு')}</h4>${rows.length?rows.map(([k,v])=>`
      <div class="barrow"><div class="h"><span>${catIcon('expense',k)} ${catName('expense',k)}</span><b>${inr(v)} · ${Math.round(v/tt.e*100)}%</b></div><div class="bar"><i style="width:${v/tt.e*100}%"></i></div></div>`).join(''):`<div class="empty">${L('No expenses this month','இந்த மாதம் செலவுகள் இல்லை')}</div>`}</div>
     ${tt.i>0?`<div class="box"><h4>${L('Savings rate','சேமிப்பு விகிதம்')}</h4><div class="bar"><i style="width:${Math.max(0,Math.min(100,tt.b/tt.i*100))}%"></i></div><p class="small" style="margin-top:8px">${Math.round(tt.b/tt.i*100)}% ${L('of income saved','வருமானம் சேமிக்கப்பட்டது')}</p></div>`:''}`);
}

/* ---- Goal ---- */
function mGoal(){
  const g=data.goal, tot=totals(data.tx);
  let prog='';
  if(g){
    const net=totals(data.tx.filter(t=>t.date>=g.start)).b, saved=Math.max(0,(g.already||0)+net);
    const pct=Math.min(100,saved/g.target*100), now=new Date(), end=new Date(g.date);
    let months=(end.getFullYear()-now.getFullYear())*12+(end.getMonth()-now.getMonth())+(end.getDate()>=now.getDate()?0:-1);
    months=Math.max(months,0);
    const left=Math.max(0,g.target-saved), per=months>0?left/months:left;
    prog=`<div class="box"><h4>${L('Progress','முன்னேற்றம்')} · ${Math.round(pct)}%</h4><div class="bar"><i style="width:${pct}%"></i></div>
      <p class="small" style="margin-top:10px">${inr(saved)} / ${inr(g.target)}</p></div>
      <div class="stats"><div class="stat"><small>${L('Remaining','மீதம்')}</small><b>${inr(left)}</b></div>
      <div class="stat"><small>${L('Months left','மாதங்கள்')}</small><b>${months}</b></div>
      <div class="stat"><small>${L('Save / month','மாதம் சேமிக்க')}</small><b class="mint">${inr(per)}</b></div></div>
      ${left===0?`<div class="box center mint"><b>🎉 ${L('Goal reached!','இலக்கு எட்டப்பட்டது!')}</b></div>`:''}`;
  }
  openModal(L('TARGET / 05','இலக்கு / 05'), L('Savings Goal','சேமிப்பு இலக்கு'), `
    <p class="lead">${L('Set how much you want to save and by when. We will show how much to save every month.','எவ்வளவு, எப்போது சேமிக்க வேண்டும் என அமைக்கவும். மாதம் எவ்வளவு சேமிக்க வேண்டும் எனக் காட்டுவோம்.')}</p>
    ${prog}
    <div class="box">
      <label class="f" style="margin-top:0">${L('Target amount (₹)','இலக்குத் தொகை (₹)')}</label><input class="in" id="gT" type="number" inputmode="decimal" value="${g?g.target:''}" placeholder="100000">
      <label class="f">${L('Target date','இலக்கு தேதி')}</label><input class="in" id="gD" type="date" value="${g?g.date:''}" min="${todayStr()}">
      <label class="f">${L('Already saved (₹)','ஏற்கனவே சேமித்தது (₹)')}</label><input class="in" id="gA" type="number" inputmode="decimal" value="${g?g.already||0:0}" placeholder="0">
      <button class="btn primary full" onclick="saveGoal()">${L('Save goal','இலக்கைச் சேமி')}</button>
      ${g?`<button class="btn danger full" onclick="delGoal()">${L('Remove goal','இலக்கை நீக்கு')}</button>`:''}
    </div>
    <p class="small">${L('Savings = amount already saved + (income − expenses) since the goal was set.','சேமிப்பு = ஏற்கனவே சேமித்தது + இலக்கு அமைத்ததிலிருந்து (வருமானம் − செலவு).')}</p>`);
}
function saveGoal(){
  const t=parseFloat($('gT').value), d=$('gD').value, a=parseFloat($('gA').value)||0;
  if(!(t>0)||!d){ toast(L('Enter target amount and date','இலக்குத் தொகை மற்றும் தேதியை உள்ளிடவும்')); return; }
  data.goal={target:t,date:d,already:a,start:(data.goal&&data.goal.start)||todayStr()}; saveData(); toast(L('Goal saved ✓','இலக்கு சேமிக்கப்பட்டது ✓')); mGoal();
}
function delGoal(){ if(!confirm(L('Remove goal?','இலக்கை நீக்கவா?')))return; data.goal=null; saveData(); mGoal(); }

/* ---- Settings ---- */
function mSettings(){
  openModal(L('ACCOUNT / 06','கணக்கு / 06'), L('Settings','அமைப்புகள்'), `
    <div class="box"><h4>${L('Language','மொழி')}</h4><div class="seg"><button class="${lang==='ta'?'on':''}" onclick="setLang('ta');mSettings()">தமிழ்</button><button class="${lang==='en'?'on':''}" onclick="setLang('en');mSettings()">English</button></div></div>
    <div class="box"><h4>${L('Backup','காப்புப்பிரதி')}</h4><p class="small" style="text-align:left;margin-bottom:10px">${L('Download all your entries as a CSV (opens in Excel).','உங்கள் அனைத்துப் பதிவுகளையும் CSV ஆக பதிவிறக்கவும் (Excel-ல் திறக்கும்).')}</p><button class="btn full" style="margin-top:0" onclick="exportCsv()">⬇ ${L('Export CSV','CSV ஏற்றுமதி')}</button></div>
    <div class="box"><h4>${L('Signed in as','உள்நுழைந்தவர்')}: ${esc(user)}</h4><button class="btn danger full" style="margin-top:8px" onclick="logout()">${L('Logout','வெளியேறு')}</button></div>
    <p class="small">${L('Your account data is stored in the cloud when sync is configured. You can also export a CSV backup.','ஒத்திசைவு அமைக்கப்பட்டதும் உங்கள் கணக்குத் தரவு கிளவுட்டில் சேமிக்கப்படும். CSV காப்புப்பிரதியையும் பதிவிறக்கலாம்.')}</p>`);
}
function exportCsv(){
  const rows=[['Date','Type','Category','Amount','Note']].concat(data.tx.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type,CAT[t.type][t.cat]?CAT[t.type][t.cat][0]:t.cat,t.amount,t.note]));
  const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='paisamani-'+todayStr()+'.csv'; a.click();
}

/* ============ INIT ============ */
(async function init(){
  if(!lang) lang='en';
  applyLang();
  if(cloudConfigured() && supabaseClient){
    const {data:{session},error}=await supabaseClient.auth.getSession();
    if(!error && session?.user){ await enter(session.user.email,session.user.id); return; }
  }
  if(localStorage.getItem('pm_lang')) show('authScreen'); else show('langScreen');
  applyLang_noLang();
})();
function applyLang_noLang(){ authMode('login',true); }
</script>
</body>
</html>
